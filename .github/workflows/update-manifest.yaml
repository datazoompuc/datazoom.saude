name: Update Dataset Manifest

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      check_all:
        description: 'Probe every URL in manifest (slow)'
        required: false
        default: false
        type: boolean

concurrency:
  group: update-manifest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-manifest:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::RCurl, any::devtools, any::testthat, any::jsonlite, any::curl

      - name: Run manifest builder
        id: build
        run: |
          CHECK_FLAG=""
          if [ "${{ inputs.check_all }}" = "true" ]; then
            CHECK_FLAG="--check-all"
          fi

          set +e
          Rscript actions/scripts/build_manifest.R $CHECK_FLAG
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=unchanged" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 10 ] || [ $EXIT_CODE -eq 11 ]; then
            echo "status=changed" >> $GITHUB_OUTPUT
            if [ $EXIT_CODE -eq 11 ]; then
              echo "partial=true" >> $GITHUB_OUTPUT
            fi
          elif [ $EXIT_CODE -eq 20 ]; then
            echo "status=validation_error" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 30 ]; then
            echo "status=resolver_failed" >> $GITHUB_OUTPUT
          else
            echo "status=unknown_error" >> $GITHUB_OUTPUT
          fi

      - name: Stage candidate manifest
        if: steps.build.outputs.exit_code == '10' || steps.build.outputs.exit_code == '11'
        run: |
          cp "${{ steps.build.outputs.candidate_path }}" inst/extdata/manifest/v1/datasets_link.csv

      - name: Smoke test package
        if: steps.build.outputs.status == 'changed'
        run: |
          Rscript -e "devtools::load_all(); devtools::test()"

      - name: Prepare PR body
        if: steps.build.outputs.status == 'changed'
        id: pr_body
        run: |
          cat << 'EOF' > generate_body.R
          report_file <- Sys.getenv("REPORT_PATH", "actions/output/manifest_report.json")
          if (file.exists(report_file)) {
            rep <- jsonlite::fromJSON(report_file)
            body <- c("### Automated Dataset Manifest Update\n")
            body <- c(body, sprintf("- **Changed keys:** %d\n", rep$n_changed))
            for (k in rep$changed_keys) {
              body <- c(body, paste0("  - `", gsub("\r", " / ", k), "`"))
            }
            if (length(rep$fragility_notes) > 0) {
              body <- c(body, "\n### ⚠️ Fragile Treatment Lines to Review:\n")
              for (fn in names(rep$fragility_notes)) {
                for (note in rep$fragility_notes[[fn]]) {
                  body <- c(body, paste0("- ", note))
                }
              }
            }
            writeLines(body, "pr_body.md")
          } else {
            writeLines("Automated update of datasets_link.csv from upstream DATASUS.", "pr_body.md")
          }
          EOF
          REPORT_PATH="${{ steps.build.outputs.report_path }}" Rscript generate_body.R
          rm generate_body.R

      - name: Create Pull Request
        if: steps.build.outputs.status == 'changed'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update dataset manifest (automated CI run)"
          branch: "manifest-refresh"
          delete-branch: true
          title: "[automated] Update dataset manifest"
          body-path: "pr_body.md"
          labels: |
            automated-pr
            manifest

      - name: Report failure as GitHub Issue
        if: steps.build.outputs.exit_code == '11' || steps.build.outputs.exit_code == '20' || steps.build.outputs.exit_code == '30' || steps.build.outputs.status == 'unknown_error'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = "${{ steps.build.outputs.report_path }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let bodyLines = [
              `See the \`Run manifest builder\` step log in [this workflow run](${runUrl}) for the full report.`,
              `- **Exit code:** ${{ steps.build.outputs.exit_code }}`,
              `- **Status:** ${{ steps.build.outputs.status }}`,
              ""
            ];

            try {
              if (fs.existsSync(reportPath)) {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

                // Formatting helper for multi-line diagnostic evidence (e.g. HTTP headers/WAF block excerpt)
                const fmtMsg = (k, msg) => {
                  const [first, ...rest] = String(msg).split(/\r?\n/);
                  const detail = rest.join("\n").trim();
                  const head = `- \`${k}\`: ${first}`;
                  if (!detail) return [head];
                  const longestRun = Math.max(0, ...(detail.match(/`+/g) || []).map(r => r.length));
                  const fence = "`".repeat(Math.max(3, longestRun + 1));
                  return [head, ...[fence, ...detail.split("\n"), fence].map(l => `  ${l}`)];
                };

                const fmtFailures = (obj, label) => {
                  const entries = Object.entries(obj || {});
                  if (entries.length === 0) return [];
                  return [
                    `**${label}:**`,
                    ...entries.flatMap(([k, v]) =>
                      (Array.isArray(v) ? v : [v]).flatMap(msg => fmtMsg(k, msg))
                    ),
                    ""
                  ];
                };

                if (report.resolvers_ok && report.resolvers_ok.length > 0) {
                  bodyLines.push("**Resolvers succeeded:**");
                  for (const r of report.resolvers_ok) {
                    bodyLines.push(`- \`${r}\`: OK`);
                  }
                  bodyLines.push("");
                }

                bodyLines = bodyLines.concat(
                  fmtFailures(report.resolvers_failed, "Resolvers failed"),
                  fmtFailures(report.resolvers_partial_failed, "Resolvers partially failed (some rows still updated)")
                );

                if ((report.errors || []).length > 0) {
                  bodyLines.push(
                    "**Validation errors:**",
                    ...report.errors.map(e => `- ${e}`),
                    ""
                  );
                }
              }
            } catch (err) {
              bodyLines.push(`(Could not parse report file: ${err.message})`);
            }

            const title = "[manifest] Automated scraper or validation failure";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "manifest"
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: [`**Still failing -- run of ${new Date().toISOString().slice(0, 10)}**`, "", ...bodyLines].join("\n")
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["manifest"],
                body: bodyLines.join("\n")
              });
            }

      - name: Upload manifest report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: |
            actions/output/manifest_report.json
            actions/output/candidate_manifest.csv
          if-no-files-found: ignore

      - name: Fail workflow on fatal error
        if: steps.build.outputs.exit_code != '0' && steps.build.outputs.exit_code != '10' && steps.build.outputs.exit_code != '11'
        run: exit 1
